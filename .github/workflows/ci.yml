name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    if: always()
    needs: [go-lint, go-test, go-build, go-checks, go-race]
    runs-on: ubuntu-24.04
    steps:
      - name: Require go-race on merge queue and main
        run: |
          test '${{ needs.go-lint.result }}' = success
          test '${{ needs.go-test.result }}' = success
          test '${{ needs.go-build.result }}' = success
          test '${{ needs.go-checks.result }}' = success
          case '${{ github.event_name }}' in
            pull_request) test '${{ needs.go-race.result }}' = success || test '${{ needs.go-race.result }}' = skipped ;;
            *) test '${{ needs.go-race.result }}' = success ;;
          esac

  go-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Go build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ runner.os }}-go-lint-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ runner.os }}-go-lint-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make lint

  go-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Go build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ runner.os }}-go-test-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ runner.os }}-go-test-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make test

  go-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Go build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ runner.os }}-go-build-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ runner.os }}-go-build-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: make build

  go-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check migration history
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/check-migration-history.sh "$BASE_SHA" "$HEAD_SHA"
      - run: sh scripts/test-check-migration-history.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Go build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ runner.os }}-go-checks-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ runner.os }}-go-checks-
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check verification coverage
        shell: bash
        run: |
          set -euo pipefail
          test "$(make -n race)" = 'go test -race ./...'
          verify=$(make -n verify)
          # template-smoke runs in its own path-filtered job.
          remaining=$(make -n lint test deps-check workflow-check generate-check templ-check css-check build; make -n template-smoke)
          diff -u <(printf '%s\n' "$verify" | sed '/^go test -race \.\/\.\.\.$/d') <(printf '%s\n' "$remaining")
      - run: make deps-check workflow-check generate-check templ-check css-check

  template-changes:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' != pull_request ]; then
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On pull_request HEAD is the merge commit; HEAD^1 is the base.
          if git diff --name-only HEAD^1 HEAD | grep -Eq '^(cmd/template-init/|go\.mod$|go\.sum$|Makefile$|AGENTS\.md$|docs/README\.md$|docs/development\.md$|\.github/workflows/ci\.yml$)'; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  template-smoke:
    needs: template-changes
    if: needs.template-changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: make template-smoke

  go-race:
    if: github.event_name == 'merge_group' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Go build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ runner.os }}-go-race-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ runner.os }}-go-race-
      - run: make race

  postgres:
    if: github.event_name == 'merge_group' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:14.24-alpine3.24@sha256:727876d274666da0b92a445390ba093c84b8e9f8343e1c53cd4e9a7ab2d85310
        env:
          POSTGRES_DB: dynamis_code_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dynamis_code_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgres://postgres@127.0.0.1:5432/dynamis_code_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Go build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ runner.os }}-postgres-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ runner.os }}-postgres-
      - run: command -v pg_dump && command -v pg_restore
      - run: go test -race ./...

  changes:
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          web=true
          if [ '${{ github.event_name }}' = pull_request ]; then
            web=false
            if git diff --name-only "origin/$BASE_REF...HEAD" | grep -Eq '^(internal/web/|internal/identity/|internal/browsertest/|cmd/browsersmoke/|cmd/preview/|scripts/accessibility-smoke\.sh$|scripts/webmcp-smoke\.sh$|package[^/]*\.json$)'; then
              web=true
            fi
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"

  accessibility:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Go build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ runner.os }}-accessibility-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ runner.os }}-accessibility-
      - run: make browser-smoke
      - run: make accessibility-smoke
      - run: make webmcp-smoke

  source-vulnerabilities:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Go build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ runner.os }}-source-vulnerabilities-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ runner.os }}-source-vulnerabilities-
      - run: make vuln-check

  secrets-and-workflows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve Go build cache
        id: gocache
        run: echo "dir=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.gocache.outputs.dir }}
          key: gobuild-${{ runner.os }}-secrets-and-workflows-${{ hashFiles('go.sum') }}
          restore-keys: |
            gobuild-${{ runner.os }}-secrets-and-workflows-
      - run: make secret-check

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make docker-smoke
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: dynamis-code-apps-template:dev
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: dynamis-code-apps-template:dev
          format: spdx-json
          output-file: image.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-sbom
          path: image.spdx.json
          if-no-files-found: error

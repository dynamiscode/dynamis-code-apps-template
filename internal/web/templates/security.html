{{define "security.html"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}} · Dynamis Code</title><link rel="stylesheet" href="/assets/app.css"></head><body><header class="topbar"><a class="brand" href="/">Dynamis Code</a><div class="topbar-context"><a href="/">Workspaces</a><span aria-hidden="true">/</span><span>Account</span></div>{{template "account-menu" .}}</header><main id="main"><h1>Security</h1>{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}{{if .OIDCProviders}}<form action="/security" method="post"><input type="hidden" name="csrf" value="{{.CSRF}}"><label for="provider">Identity provider</label><select id="provider" name="provider">{{range .OIDCProviders}}<option value="{{.ID}}">{{.Name}}</option>{{end}}</select><label for="reauth-password">Confirm local password</label><input id="reauth-password" name="password" type="password" autocomplete="current-password" required><button type="submit">Link identity provider</button></form>{{else}}<p>No identity provider is configured.</p>{{end}}</main></body></html>{{end}}

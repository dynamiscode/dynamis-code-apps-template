{{define "item-list.html"}}<section id="item-list" data-events="{{.CurrentPath}}/events" data-live-connecting="{{.T "items.live_connecting"}}" data-live-connected="{{.T "items.live_connected"}}" data-live-unavailable="{{.T "items.live_unavailable"}}" data-live-reconnecting="{{.T "items.live_reconnecting"}}" aria-labelledby="items-heading">
<h2 id="items-heading">{{.T "items.items"}}</h2>{{if .Error}}<p class="error" role="alert" tabindex="-1">{{.Error}}</p>{{end}}
<form class="create" data-webmcp-actions="item-create" action="{{.CurrentPath}}" method="post" hx-post="{{.CurrentPath}}" hx-target="#item-list" hx-swap="outerHTML">
<input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="idempotency_key" value="{{.CreateKey}}"><label for="new-title">{{.T "items.new_title"}}</label><div class="row"><input id="new-title" name="title" required maxlength="200"><button type="submit">{{.T "items.add"}}</button></div></form>
{{if .Items}}<ul class="items">{{range .Items}}<li><form data-webmcp-actions="item-update item-delete" data-webmcp-id="{{.ID}}" action="{{$.CurrentPath}}/{{.ID}}" method="post" hx-post="{{$.CurrentPath}}/{{.ID}}" hx-target="#item-list" hx-swap="outerHTML">
<input type="hidden" name="csrf" value="{{$.CSRF}}"><input type="hidden" name="version" value="{{.Version}}"><label for="title-{{.ID}}">{{$.T "items.title"}}</label><input id="title-{{.ID}}" name="title" value="{{.Title}}" required maxlength="200"><label for="status-{{.ID}}">{{$.T "items.status"}}</label><select id="status-{{.ID}}" name="status"><option value="active"{{if eq .Status "active"}} selected{{end}}>{{$.T "items.active"}}</option><option value="complete"{{if eq .Status "complete"}} selected{{end}}>{{$.T "items.complete"}}</option></select><div class="actions"><button type="submit" name="action" value="update" aria-label="{{$.T "items.save"}} {{.Title}}">{{$.T "items.save"}}</button><button class="danger" type="submit" name="action" value="delete" aria-label="{{$.T "items.delete_permanently"}} {{.Title}}" data-confirm="{{$.T "items.delete_confirm_full"}}">{{$.T "items.delete_permanently"}}</button></div></form></li>{{end}}</ul>{{else}}<p>{{.T "items.none"}}</p>{{end}}
{{if .NextCursor}}<p><a href="{{.CurrentPath}}?cursor={{.NextCursor}}">{{.T "items.next_page"}}</a></p>{{end}}<p class="status" role="status" aria-live="polite" id="realtime-status">{{.T "items.live_fallback"}}</p></section>{{end}}

{{define "item-list.html"}}<section id="item-list" data-events="{{.CurrentPath}}/events" aria-labelledby="items-heading">
<h2 id="items-heading">Items</h2>{{if .Error}}<p class="error" role="alert" tabindex="-1">{{.Error}}</p>{{end}}
<form class="create" data-webmcp-actions="item-create" action="{{.CurrentPath}}" method="post" hx-post="{{.CurrentPath}}" hx-target="#item-list" hx-swap="outerHTML">
<input type="hidden" name="csrf" value="{{.CSRF}}"><input type="hidden" name="idempotency_key" value="{{.CreateKey}}"><label for="new-title">New item title</label><div class="row"><input id="new-title" name="title" required maxlength="200"><button type="submit">Add item</button></div></form>
{{if .Items}}<ul class="items">{{range .Items}}<li><form data-webmcp-actions="item-update item-delete" data-webmcp-id="{{.ID}}" action="{{$.CurrentPath}}/{{.ID}}" method="post" hx-post="{{$.CurrentPath}}/{{.ID}}" hx-target="#item-list" hx-swap="outerHTML">
<input type="hidden" name="csrf" value="{{$.CSRF}}"><input type="hidden" name="version" value="{{.Version}}"><label for="title-{{.ID}}">Title</label><input id="title-{{.ID}}" name="title" value="{{.Title}}" required maxlength="200"><label for="status-{{.ID}}">Status</label><select id="status-{{.ID}}" name="status"><option value="active"{{if eq .Status "active"}} selected{{end}}>Active</option><option value="complete"{{if eq .Status "complete"}} selected{{end}}>Complete</option></select><div class="actions"><button type="submit" name="action" value="update" aria-label="Save {{.Title}}">Save</button><button class="danger" type="submit" name="action" value="delete" aria-label="Permanently delete {{.Title}}" data-confirm="Permanently delete this item? This action cannot be undone.">Delete permanently</button></div></form></li>{{end}}</ul>{{else}}<p>No items yet.</p>{{end}}
{{if .NextCursor}}<p><a href="{{.CurrentPath}}?cursor={{.NextCursor}}">Next page</a></p>{{end}}<p class="status" role="status" aria-live="polite" id="realtime-status">Live updates connect when supported; refresh otherwise.</p></section>{{end}}

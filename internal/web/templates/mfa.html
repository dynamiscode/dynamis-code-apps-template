{{define "mfa.html"}}<!doctype html><html lang="{{.Locale}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}} · Dynamis Code</title><link rel="stylesheet" href="/assets/app.css"><script src="/assets/mfa.js" defer></script></head><body><main class="narrow" id="main"><h1>{{.T "security.mfa_title"}}</h1>{{if .MFAError}}<p class="error" role="alert">{{.MFAError}}</p>{{end}}<p>{{.T "security.mfa_verify_prompt"}}</p>{{if .MFAOptions}}<button id="passkey-login" type="button" data-challenge="{{.MFAChallenge}}" data-csrf="{{.CSRF}}">{{.T "security.mfa_use_passkey"}}</button><script id="mfa-options" type="application/json">{{.MFAOptions}}</script>{{end}}<form action="/mfa/totp" method="post"><input type="hidden" name="csrf" value="{{.CSRF}}"><label for="totp-code">{{.T "security.mfa_authenticator_code"}}</label><input id="totp-code" name="code" inputmode="numeric" autocomplete="one-time-code" minlength="6" maxlength="6" required><button type="submit">{{.T "security.mfa_verify_code"}}</button></form><form action="/mfa/recovery" method="post"><input type="hidden" name="csrf" value="{{.CSRF}}"><label for="recovery-code">{{.T "security.mfa_recovery_code"}}</label><input id="recovery-code" name="code" autocomplete="one-time-code" required><button type="submit">{{.T "security.mfa_use_recovery"}}</button></form></main></html>{{end}}

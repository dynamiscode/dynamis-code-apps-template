<!doctype html>
<!-- PROTOTYPE: Three catalog layouts, switchable via ?variant=, using sample data. -->
<html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalog UI prototype</title><link rel="stylesheet" href="assets/components.css"><style>
body{margin:0;font-family:system-ui,sans-serif;background:#f3f6fa;color:#172033}*{box-sizing:border-box}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:#edf1f7;border-right:1px solid #ccd3dd;padding:28px 18px}.brand{font-weight:750;margin:0 12px 32px}.sidebar .menu{padding:0;width:100%}main{padding:32px 40px 110px;max-width:1450px;width:100%}.topline{display:flex;justify-content:space-between;border-bottom:1px solid #ccd3dd;padding-bottom:20px;color:#536174;font-size:14px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:36px 0 25px}.heading h1{font-size:32px;margin:4px 0}.muted{color:#536174}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:#536174}.notice{padding:12px 16px;background:#fff8db;border:1px solid #d6b656;border-radius:4px;margin-bottom:20px;font-size:13px}.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}.panel{background:white;border:1px solid #ccd3dd;border-radius:6px}.small{font-size:13px}.price{font-weight:700;white-space:nowrap}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.price-row{display:grid;grid-template-columns:1fr 1fr auto;gap:16px;padding:13px 0;border-top:1px solid #e2e6ec}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.entry{padding:22px}.entry h2{font-size:17px;margin:0}.split{display:grid;grid-template-columns:300px 1fr;min-height:420px}.split-list{border-right:1px solid #ccd3dd}.pick{display:block;width:100%;text-align:left;padding:18px;border:0;border-bottom:1px solid #e2e6ec;background:white;cursor:pointer}.pick[aria-current=true]{background:#e8effa;border-left:3px solid #154ea3}.details{padding:28px}.switcher{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:#172033;color:#fff;border-radius:40px;padding:7px;box-shadow:0 5px 24px #17203340;white-space:nowrap}.switcher button{border:0;background:white;color:#172033;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:20px}.switcher span{min-width:160px;text-align:center;font-size:13px}@media(max-width:700px){.shell{display:block}.sidebar{display:none}main{padding:20px 16px 100px}.heading{align-items:start;flex-direction:column}.cards,.split{grid-template-columns:1fr}.split-list{border-right:0;border-bottom:1px solid #ccd3dd}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">◈ &nbsp;Dynamis</div><div class="eyebrow">Workspace</div><ul class="menu"><li><a>Overview</a></li><li><a>Clients</a></li><li><a class="menu-active" aria-current="page">Catalog</a></li><li><a>Files</a></li><li><a>Settings</a></li></ul></aside><main><div class="topline"><span>Workspace / Catalog</span><span>Example workspace · Owner</span></div><div class="heading"><div><div class="eyebrow">Workspace</div><h1>Catalog</h1><div class="muted">Services and prices your team can quote.</div></div><button class="btn btn-primary" disabled>+ New entry</button></div><div class="notice">Prototype · Sample data only. Create and edit actions are not connected.</div><div class="toolbar"><input class="input input-bordered" id="search" type="search" placeholder="Search catalog" aria-label="Search catalog"><label><input type="checkbox" id="archived"> Show archived</label><span id="count" class="muted small"></span></div><div id="view"></div></main></div><div class="switcher" aria-label="Prototype variant switcher"><button id="prev" aria-label="Previous variant">‹</button><span id="variant-label" aria-live="polite"></span><button id="next" aria-label="Next variant">›</button></div>
<script>
const entries=[{name:'Consultation',duration:'60 min',prices:[['Initial visit','','$120.00 USD'],['Follow-up','','$85.00 USD'],['Follow-up','Student','$65.00 USD']]},{name:'Weekly coaching',duration:'45 min',prices:[['Per week','','$90.00 USD'],['Per week','Student','$70.00 USD']]},{name:'Custom session',duration:'Duration not set',prices:[['Per session','','Manual · USD']]},{name:'Introductory session',duration:'30 min',archived:true,prices:[['Per visit','','€40.00 EUR']]}];
const names=['A · Price table','B · Entry cards','C · List and detail'];let selected=0;const view=document.querySelector('#view');
function variant(){let v=new URLSearchParams(location.search).get('variant');return ['A','B','C'].includes(v)?v:'A'}
function shown(){let q=document.querySelector('#search').value.toLowerCase();return entries.filter(e=>(!e.archived||document.querySelector('#archived').checked)&&e.name.toLowerCase().includes(q))}
function prices(e){return e.prices.map(p=>`<div class="price-row"><span>${p[0]}</span><span class="muted">${p[1]||'Everyone'}</span><span class="price">${p[2]}</span></div>`).join('')}
function title(e){return `${e.name}${e.archived?' <span class="badge">Archived</span>':''}`}
function render(){let list=shown();document.querySelector('#count').textContent=`${list.length} ${list.length===1?'entry':'entries'}`;document.querySelector('#variant-label').textContent=names[['A','B','C'].indexOf(variant())];if(!list.length){view.innerHTML='<div class="panel entry">No entries match your search.</div>';return}if(variant()==='A'){view.innerHTML=`<div class="panel overflow-x-auto"><table class="table"><thead><tr><th>Entry</th><th>Variant</th><th>Eligibility</th><th>Price</th></tr></thead><tbody>${list.map(e=>e.prices.map((p,i)=>`<tr><td>${i?'':`<strong>${title(e)}</strong><br><span class="muted small">${e.duration}</span>`}</td><td>${p[0]}</td><td>${p[1]||'Everyone'}</td><td class="price">${p[2]}</td></tr>`).join('')).join('')}</tbody></table></div>`}else if(variant()==='B'){view.innerHTML=`<div class="cards">${list.map(e=>`<article class="panel entry"><div class="row"><h2>${title(e)}</h2><span class="muted small">${e.duration}</span></div><p class="muted small">${e.prices.length} price options</p>${prices(e)}</article>`).join('')}</div>`}else{if(!list.includes(entries[selected]))selected=entries.indexOf(list[0]);let e=entries[selected];view.innerHTML=`<div class="panel split"><div class="split-list" aria-label="Catalog entries">${list.map(item=>`<button class="pick" data-entry="${entries.indexOf(item)}" aria-current="${item===e}"><strong>${title(item)}</strong><br><span class="muted small">${item.duration} · ${item.prices.length} price options</span></button>`).join('')}</div><section class="details"><div class="eyebrow">Catalog entry</div><div class="row"><h2>${title(e)}</h2><button class="btn btn-sm" disabled>Edit</button></div><p class="muted">${e.duration}</p><h3>Price options</h3><div class="price-row muted small"><span>Variant</span><span>Eligibility</span><span>Price</span></div>${prices(e)}</section></div>`;view.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.entry);render()})}}
function cycle(n){let all=['A','B','C'];let url=new URL(location.href);url.searchParams.set('variant',all[(all.indexOf(variant())+n+3)%3]);history.replaceState(null,'',url);render()}document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.querySelector('#search').oninput=render;document.querySelector('#archived').onchange=render;document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>

\* Chart config for verification/web/ItemCreate.tla: MaxPress 2 keeps the graph
\* under the chart budget. The check itself runs verification/web/ItemCreate.cfg.
SPECIFICATION Spec
CONSTANTS
    Titles = {"A", "B"}
    Blank = "blank"
    MaxItems = 1
    MaxPress = 2
INVARIANTS
    OneItemPerKey
    NoSilentLoss
    InputKeptOnReject
    BusyWhileSending
    OneRequestInFlight
